name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/warhammer-40k-simulator-rZ6XC
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Firebase config: use real secrets if set, otherwise placeholders.
      # Placeholders let the APK build and run — multiplayer won't connect,
      # but all offline features (dice, army import, stats, etc.) work fine.
      - name: Write .env
        run: |
          cat > .env <<'ENVEOF'
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY || 'placeholder-api-key' }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN || 'placeholder.firebaseapp.com' }}
          FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL || 'https://placeholder-default-rtdb.firebaseio.com' }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || 'placeholder-project' }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET || 'placeholder.appspot.com' }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID || '1:000000000000:web:placeholder' }}
          ENVEOF

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wh40k-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
